[package]
name = "avito-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Rust port of Duff89/parser_avito: Avito listing monitor with filters, dedup, price tracking, Telegram/VK notifications, CSV/XLSX export"
license = "MIT"
repository = "https://github.com/Githab-capibara/avito-rs"
homepage = "https://github.com/Githab-capibara/avito-rs"
readme = "README.md"
keywords = ["avito", "scraper", "monitor", "telegram", "async"]
categories = ["command-line-utilities", "web-programming", "asynchronous"]
exclude = ["target/", "logs/", "out/", "*.db"]

[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "signal",
    "sync",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "json",
    "cookies",
    "multipart",
    "blocking",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
thiserror = "1"

[features]
default = []
api = ["dep:axum"]
xlsx = ["dep:rust_xlsxwriter"]
html-fallback = ["dep:scraper"]

[dependencies.axum]
version = "0.7"
optional = true
default-features = false
features = ["http1", "tokio", "json"]

[dependencies.rust_xlsxwriter]
version = "0.6"
optional = true

[dependencies.scraper]
version = "0.20"
optional = true

[dev-dependencies]
axum = "0.7"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
